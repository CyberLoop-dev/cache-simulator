<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cache Simulator</title>
<style>body{font:16px system-ui;background:#0e1728;color:#e9f2ff;max-width:900px;margin:40px auto;padding:0 18px}input,select,button{padding:10px;border-radius:8px;background:#1b2a42;color:inherit;border:1px solid #405875}button{cursor:pointer}.panel{background:#17243a;padding:16px;border-radius:12px;margin:14px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #35445a}.hit{color:#4ee0b6}.miss{color:#ffae7a}</style>
<h1>Cache Simulator</h1><p>Compare FIFO and LRU replacement on the same access sequence.</p>
<div class="panel"><label>Sequence <input id="seq" value="1,2,3,1,4,1,2,5" size="34"></label> <label>Capacity <input id="cap" type="number" min="1" max="12" value="3" style="width:65px"></label> <label>Policy <select id="policy"><option>FIFO</option><option>LRU</option></select></label> <button id="run">Simulate</button></div>
<div class="panel"><h3 id="summary">Ready</h3><table><thead><tr><th>Step</th><th>Page</th><th>Result</th><th>Cache after access</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
function simulate(seq,cap,policy){let cache=[],hits=0,misses=0,rows=[];for(const page of seq){const found=cache.indexOf(page);let result;if(found>=0){hits++;result='HIT';if(policy==='LRU'){cache.splice(found,1);cache.push(page);}}else{misses++;result='MISS';if(cache.length>=cap)cache.shift();cache.push(page);}rows.push({page,result,cache:cache.slice()});}return {hits,misses,rows};}
document.querySelector('#run').onclick=()=>{const seq=document.querySelector('#seq').value.split(',').map(x=>x.trim()).filter(Boolean),cap=Number(document.querySelector('#cap').value),policy=document.querySelector('#policy').value;if(!seq.length||!Number.isInteger(cap)||cap<1){alert('Enter a sequence and a positive capacity.');return;}const r=simulate(seq,cap,policy);document.querySelector('#summary').textContent=policy+': '+r.hits+' hits, '+r.misses+' misses, '+(100*r.hits/seq.length).toFixed(1)+'% hit rate';document.querySelector('#rows').innerHTML=r.rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.page+'</td><td class="'+x.result.toLowerCase()+'">'+x.result+'</td><td>'+x.cache.join(', ')+'</td></tr>').join('');};document.querySelector('#run').click();
</script></html>
